<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>フラワーポップ（スマホ対応）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body { background:#0c1024; display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
         min-height:100vh; font-family:'Segoe UI','MS PGothic',sans-serif; touch-action:none; overflow:hidden;
         padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom)); }
  canvas { display:block; box-shadow:0 0 36px rgba(120,150,255,0.3); border-radius:8px;
           max-width:96vw; max-height:58vh; height:auto; image-rendering:auto; }
  #hint { color:#8aa; font-size:11px; margin-top:6px; text-align:center; max-width:96vw; }
  /* タッチ操作パッド */
  #pad{ width:100%; max-width:440px; margin-top:10px; display:flex; flex-direction:column; gap:8px; align-items:center; user-select:none; }
  #pad .row{ display:flex; gap:10px; justify-content:center; width:100%; }
  .btn{ flex:1; min-width:0; height:62px; border-radius:14px; border:1px solid #2c3650; background:linear-gradient(#28304a,#1d2236);
        color:#e6ebf5; font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center;
        box-shadow:0 3px 0 #11151f; cursor:pointer; }
  .btn:active{ transform:translateY(2px); box-shadow:0 1px 0 #11151f; background:linear-gradient(#39466c,#28304a); }
  .btn small{ font-size:11px; font-weight:600; opacity:.7; margin-left:4px; }
  .btn.rot{ background:linear-gradient(#3a2e5e,#2a2044); }
  .btn.hard{ background:linear-gradient(#5e2e3a,#44202a); }
  .btn.sys{ height:40px; font-size:14px; border-radius:10px; }
  @media (min-height:760px){ canvas{ max-height:62vh; } .btn{ height:70px; } }
</style>
</head>
<body>
<canvas id="c" width="470" height="486"></canvas>
<div id="pad">
  <div class="row">
    <div class="btn rot" id="bRotL">↺</div>
    <div class="btn" id="bLeft">◀</div>
    <div class="btn" id="bRight">▶</div>
    <div class="btn rot" id="bRotR">↻</div>
  </div>
  <div class="row">
    <div class="btn" id="bDown">▼<small>高速</small></div>
    <div class="btn hard" id="bDrop">⤓<small>落とす</small></div>
  </div>
  <div class="row">
    <div class="btn sys" id="bPause">⏸ ポーズ</div>
    <div class="btn sys" id="bMute">🔊 音</div>
    <div class="btn sys" id="bRestart">↺ 最初から</div>
  </div>
</div>
<div id="hint">タッチ操作 ／ PCは ← → 移動・↓高速・Z/X回転・Space落とす ／ 画面タップでスタート</div>
<script>
'use strict';
const C = document.getElementById('c'), ctx = C.getContext('2d');
// ── 調整用定数 ───────────────────────────────────────────────
const TS=32, COLS=6, ROWS=12, HIDDEN=2, FR=ROWS+HIDDEN;   // フィールド 6x12 + 隠し2行
const COLORS_N=4;                                          // 使用色数（4 or 5）
const SPAWN_COL=2;                                         // 組はな出現列
const FX=24, FY=76;                                        // フィールド左上(px)
const BASEFALL=800, MINFALL=120, SOFT_FALL=34;             // 落下間隔(ms)
const LOCK_DELAY=450, MAX_RESET=10;                        // 接地猶予
const DAS=160, ARR=40;                                     // 左右リピート
const FLASH_MS=260;                                        // 消去フラッシュ
const GARBAGE_ENABLED=true, GARBAGE_RATE=0.22;             // お邪魔（石ころ）※0.34→0.22に緩和
const OJAMA=9;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
// 配点テーブル（連鎖ボーナス式）
const CHAIN_POWER=[0,0,8,16,32,64,96,128,160,192,224,256,288,320,352,384,416,448,480,512];
const COLOR_BONUS=[0,0,3,6,12,24];
function groupBonus(n){ if(n<=4) return 0; if(n>=11) return 10; return [0,0,0,0,0,2,3,4,5,6,7][n]; }
// 色パレット
const PAL=[null,
  {m:'#ff5d5d',l:'#ffd2d2',d:'#b8302a'},
  {m:'#57d06a',l:'#cdf3d2',d:'#2e8b3d'},
  {m:'#5aa6ff',l:'#cfe6ff',d:'#2b6fc0'},
  {m:'#ffd24d',l:'#fff0c0',d:'#c79a18'},
  {m:'#c879f0',l:'#eed4fb',d:'#8e3fc0'}];
const OJ_COL={m:'#aeb6c0',l:'#e7ecf2',d:'#6c7480'};
// ── 状態 ─────────────────────────────────────────────────────
let field, cur, queue, score, hi, level, totalCleared, chain;
let busy=false, state='title';
let parts=[], flash=null, chainText=null;
let shakeMag=0, scrFlash=null;          // 画面シェイク／全画面フラッシュ（D2演出）
function shake(m){ if(m>shakeMag) shakeMag=m; }
function screenFlash(col,a,dur){ scrFlash={col,a,born:clock(),dur:dur||0.4}; }
let fallAcc=0, lockAcc=0, lockResets=0, ojamaAcc=0, fallInterval=BASEFALL;
let softDrop=false, dasDir=0, dasTimer=0, dasCharged=false;
let hardLand=false, wasDanger=false;     // 接地音の出し分け／危機に入った瞬間の警報（M4）
let mode='endless', menuIdx=0, playMs=0, won=false;      // モード/タイトル選択/経過時間/勝利
let enemy=null, bossIdx=0, pendingGarbage=0;             // ボス連戦
hi = +(localStorage.getItem('puyo_hi')||0);
let hiChain = +(localStorage.getItem('puyo_hichain')||0);      // 自己最大連鎖（永続記録）
let bossClears = +(localStorage.getItem('puyo_bossclears')||0); // ボス連戦クリア回数（永続記録）
let runMaxChain = 0;                                            // 今回のプレイでの最大連鎖
let seenHowTo = (function(){ try{ return localStorage.getItem('flowerpop_howto')==='1'; }catch(e){ return false; } })();
let pendingMode = null;         // ハウツー画面から戻る先のモード
let bossToast = null;           // {text, born} ボス出現/撃退トースト
function toast(text){ bossToast={text, born:clock()}; }
const MODES=[{key:'endless',label:'ひとり（エンドレス）'},{key:'boss',label:'ボス連戦'}];
const BOSSES=[                                            // 弱→強：魚→イノシシ→太陽
  {name:'さかな',  hp:55,  atk:9000, gpa:2, fallMul:1.00, col:'#5ad0ff', draw:drawFish},
  {name:'イノシシ',hp:100, atk:6500, gpa:3, fallMul:0.85, col:'#c89a6a', draw:drawBoar},
  {name:'たいよう',hp:175, atk:4800, gpa:4, fallMul:0.70, col:'#ffcf3a', draw:drawSun},
];
const BOSS_TEXT=[                                         // 出現／撃破の一言（榊原千唐）
  { enter:'小さな影が、川上からやってきた――さかな。',       clear:'さかなは静かに、水面へ還っていった。' },
  { enter:'土煙をあげて、山からイノシシが暴れ込む。',       clear:'イノシシは鼻を鳴らし、山へと駆けもどっていった。' },
  { enter:'空を焦がすように、たいようが花園に舞い降りる。', clear:null },
];
const clock=()=>performance.now();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const inB=(r,c)=> r>=0&&r<FR&&c>=0&&c<COLS;
const randPair=()=>[1+(Math.random()*COLORS_N|0),1+(Math.random()*COLORS_N|0)];
// ── ピース操作 ───────────────────────────────────────────────
function childCell(ax,ay,rot){ return rot===0?[ay-1,ax]: rot===1?[ay,ax+1]: rot===2?[ay+1,ax]: [ay,ax-1]; }
function canPlace(ax,ay,rot){ const b=childCell(ax,ay,rot);
  return inB(ay,ax)&&field[ay][ax]===0 && inB(b[0],b[1])&&field[b[0]][b[1]]===0; }
function tryMove(d){ if(canPlace(cur.ax+d,cur.ay,cur.rot)){ cur.ax+=d; return true; } return false; }
function tryDown(){ if(canPlace(cur.ax,cur.ay+1,cur.rot)){ cur.ay++; return true; } return false; }
function tryRotate(dir){
  const nrot=(cur.rot+dir+4)%4;
  for(const [kx,ky] of [[0,0],[-1,0],[1,0],[0,-1],[1,-1],[-1,-1]])
    if(canPlace(cur.ax+kx,cur.ay+ky,nrot)){ cur.ax+=kx; cur.ay+=ky; cur.rot=nrot; return true; }
  if(cur.rot===0||cur.rot===2){ const flip=(cur.rot+2)%4;     // クイックターン
    if(canPlace(cur.ax,cur.ay-1,flip)){ cur.ay-=1; cur.rot=flip; return true; }
    if(canPlace(cur.ax,cur.ay,flip)){ cur.rot=flip; return true; } }
  return false;
}
function placePiece(){ const b=childCell(cur.ax,cur.ay,cur.rot);
  field[cur.ay][cur.ax]=cur.c1; field[b[0]][b[1]]=cur.c2; }
function spawn(){
  const p=queue.shift(); queue.push(randPair());
  cur={ax:SPAWN_COL,ay:HIDDEN+1,rot:0,c1:p[0],c2:p[1]};
  fallAcc=0; lockAcc=0; lockResets=0;
  if(!canPlace(cur.ax,cur.ay,cur.rot)){ cur=null; return false; }
  return true;
}
function resetLock(){ if(cur && !canPlace(cur.ax,cur.ay+1,cur.rot) && lockResets<MAX_RESET){ lockAcc=0; lockResets++; } }
function doMove(d){ if(!cur) return; if(tryMove(d)){ Audio.move(); resetLock(); } else Audio.bump(); }      // 動けない時も音で返す（M4）
function doRotate(d){ if(!cur) return; if(tryRotate(d)){ Audio.rotate(); resetLock(); } else Audio.bump(); }
function hardDrop(){ if(!cur) return; while(canPlace(cur.ax,cur.ay+1,cur.rot)) cur.ay++; hardLand=true; shake(3.5); lockPiece(); }
function lockPiece(){ placePiece(); if(hardLand){ Audio.drop(); hardLand=false; } else Audio.land(); cur=null; resolve(); }  // ドスンと コトッ を区別
// ── 盤面処理（重力・連結・消去・連鎖）───────────────────────
function applyGravity(){
  for(let c=0;c<COLS;c++){ const st=[];
    for(let r=FR-1;r>=0;r--){ if(field[r][c]!==0){ st.push(field[r][c]); field[r][c]=0; } }
    let r=FR-1; for(const v of st){ field[r][c]=v; r--; } }
}
function findGroups(){
  const seen=Array.from({length:FR},()=>Array(COLS).fill(false)); const groups=[];
  for(let r=0;r<FR;r++)for(let c=0;c<COLS;c++){
    const v=field[r][c]; if(v===0||v===OJAMA||seen[r][c]) continue;
    const q=[[r,c]]; seen[r][c]=true; const g=[];
    while(q.length){ const [cr,cc]=q.pop(); g.push([cr,cc]);
      for(const [dr,dc] of DIRS){ const nr=cr+dr,nc=cc+dc;
        if(inB(nr,nc)&&!seen[nr][nc]&&field[nr][nc]===v){ seen[nr][nc]=true; q.push([nr,nc]); } } }
    if(g.length>=4) groups.push(g);
  }
  return groups;
}
async function resolve(){
  busy=true; chain=0;
  while(true){
    applyGravity(); render();
    const groups=findGroups();
    if(groups.length===0) break;
    chain++;
    if(chain>runMaxChain) runMaxChain=chain;
    const cells=[]; const colorSet=new Set(); let gBonus=0;
    for(const g of groups){ gBonus+=groupBonus(g.length); colorSet.add(field[g[0][0]][g[0][1]]);
      for(const rc of g) cells.push(rc); }
    const oj=new Set();
    for(const [r,c] of cells) for(const [dr,dc] of DIRS){ const nr=r+dr,nc=c+dc;
      if(inB(nr,nc)&&field[nr][nc]===OJAMA) oj.add(nr+','+nc); }
    const cleared=cells.length;
    const mult=Math.max(1, CHAIN_POWER[Math.min(chain,19)] + gBonus + (COLOR_BONUS[colorSet.size]||0));
    const gain=cleared*10*mult; score+=gain;
    if(mode==='boss' && enemy && enemy.hp>0){            // 連鎖が大きいほど大ダメージ
      enemy.hp=Math.max(0, enemy.hp - cleared*chain);
      enemy.hitFlash=clock(); enemy.atkAcc=Math.max(0, enemy.atkAcc-1200);
      shake(5); Audio.hit();                             // 敵ヒットの手応え（D2＋M4）
    }
    chainText={chain,gain,born:clock()};
    flash={set:new Set([...cells.map(rc=>rc[0]+','+rc[1]),...oj]), born:clock()};
    Audio.pop(chain);
    if(oj.size) Audio.ojamaBreak();                       // お邪魔を巻き込んで割った音（M4）
    // D2演出：消去は連鎖・消し数に応じてシェイク＋色フラッシュ、大連鎖は金の閃光
    shake(3 + chain*2.2 + Math.min(7, cleared*0.5));
    if(chain>=5){ screenFlash('#ffe27a', 0.34, 0.55); shake(12+chain); }
    else { const fc=[...colorSet][0]||1; screenFlash(PAL[fc].m, 0.13, 0.30); }
    if(chain>=5) Audio.chainBurst();                     // 大連鎖の節目に専用ジングル（M3）
    await sleep(FLASH_MS);
    for(const [r,c] of cells){ burstAt(c,r,PAL[field[r][c]].m); field[r][c]=0; }
    for(const s of oj){ const [r,c]=s.split(',').map(Number); burstAt(c,r,OJ_COL.l); field[r][c]=0; }
    flash=null; totalCleared+=cleared; updateLevel();
    await sleep(110);
  }
  chainText=null;
  if(mode==='boss'){ const drop=Math.min(pendingGarbage,COLS); if(drop>0){ dropOjama(drop); pendingGarbage-=drop; } }
  else dropGarbage();
  applyGravity(); render();
  if(mode==='boss' && enemy && enemy.hp<=0){ advanceBoss(); }
  if(state==='over'){ busy=false; return; }              // ボス全滅＝クリアで終了
  if(!spawn()) gameOver();
  busy=false;
}
function dropOjama(n){                                    // 空き列の最上段へ n 個
  let put=0;
  for(let i=0;i<n;i++){ const cands=[]; for(let c=0;c<COLS;c++) if(field[0][c]===0) cands.push(c);
    if(!cands.length) break; field[0][cands[Math.random()*cands.length|0]]=OJAMA; put++; }
  if(put) Audio.ojama(put);                               // 降ってきた数だけパラパラ鳴る（M4）
}
function dropGarbage(){
  if(!GARBAGE_ENABLED || level<3) return;    // Lv1-2はお邪魔なしの猶予期間（初見殺し対策）
  ojamaAcc += GARBAGE_RATE*(level-1);
  let n=Math.min(COLS, Math.floor(ojamaAcc)); if(n<=0) return; ojamaAcc-=n; dropOjama(n);
}
function updateLevel(){ /* 落下速度・難度は update() で連続的に算出 */ }
function setEnemy(i){ const b=BOSSES[i];
  enemy={name:b.name,hp:b.hp,maxhp:b.hp,atk:b.atk,gpa:b.gpa,fallMul:b.fallMul,col:b.col,draw:b.draw,atkAcc:0,hitFlash:0,warn:0}; }
function advanceBoss(){
  Audio.win(); screenFlash('#fff2c0',0.4,0.6); shake(15); const beaten=bossIdx; bossIdx++;
  if(bossIdx>=BOSSES.length){ bossClears++; try{localStorage.setItem('puyo_bossclears',bossClears);}catch(e){} winGame(); return; }  // 太陽まで倒したらクリア
  setEnemy(bossIdx);
  setTimeout(()=>Audio.bossIn(), 700);                   // 勝利ジングルの余韻のあと次の番人が現れる（M4）
  toast(BOSS_TEXT[beaten].clear+'\n\n'+BOSS_TEXT[bossIdx].enter);
  for(let r=0;r<FR;r++)for(let c=0;c<COLS;c++) if(field[r][c]===OJAMA && Math.random()<0.5){ burstAt(c,r,OJ_COL.l); field[r][c]=0; }  // ごほうび
  applyGravity();
}
function winGame(){ won=true; state='over'; Audio.fanfare(); screenFlash('#ffd24d',0.5,0.9); shake(20);
  if(score>hi){ hi=score; localStorage.setItem('puyo_hi',hi); }
  if(runMaxChain>hiChain){ hiChain=runMaxChain; try{localStorage.setItem('puyo_hichain',hiChain);}catch(e){} } }
function gameOver(){ won=false; state='over'; Audio.over(); screenFlash('#ff5d5d',0.45,0.8); shake(14);
  if(score>hi){ hi=score; localStorage.setItem('puyo_hi',hi); }
  if(runMaxChain>hiChain){ hiChain=runMaxChain; try{localStorage.setItem('puyo_hichain',hiChain);}catch(e){} } }
// ── パーティクル ─────────────────────────────────────────────
function burstAt(c,r,col){ const x=FX+c*TS+TS/2, y=FY+(r-HIDDEN)*TS+TS/2;
  for(let i=0;i<11;i++){ const a=Math.random()*6.28, s=1.5+Math.random()*4.2;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,col,life:0,dur:0.45+Math.random()*0.35,r:2+Math.random()*2.6}); }
  for(let i=0;i<3;i++){ const a=Math.random()*6.28, s=2.5+Math.random()*3;   // 白いきらめき
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.6,col:'#fff',life:0,dur:0.3+Math.random()*0.22,r:1.1+Math.random()*1.2,spark:true}); } }
function updateParticles(dt){ const f=dt/16;
  for(const p of parts){ p.life+=dt/1000; p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=0.5*f; }
  parts=parts.filter(p=>p.life<p.dur);
  if(shakeMag>0){ shakeMag*=Math.pow(0.86,f); if(shakeMag<0.3) shakeMag=0; }   // シェイク減衰
}
// ── 描画 ─────────────────────────────────────────────────────
function cellXY(r,c){ return [FX+c*TS+TS/2, FY+(r-HIDDEN)*TS+TS/2]; }
function drawPuyo(cx,cy,R,idx,alpha,scale){
  /* 花モチーフ描画（5枚の花びら＋黄色い花芯）。お邪魔は石ころ */
  alpha=alpha==null?1:alpha; scale=scale==null?1:scale; const r=R*scale;
  const P = idx===OJAMA?OJ_COL:PAL[idx];
  ctx.save(); ctx.globalAlpha=alpha;
  if(idx===OJAMA){
    const g=ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.2,cx,cy,r);
    g.addColorStop(0,P.l); g.addColorStop(0.55,P.m); g.addColorStop(1,P.d);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r*0.92,0,6.2832); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,0.45)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(cx-r*0.45,cy-r*0.05); ctx.lineTo(cx-r*0.05,cy+r*0.22);
    ctx.moveTo(cx+r*0.12,cy-r*0.38); ctx.lineTo(cx+r*0.42,cy+r*0.05); ctx.stroke();
    ctx.restore(); return;
  }
  for(let i=0;i<5;i++){
    const a=-1.5708+i*1.2566;
    const px=cx+Math.cos(a)*r*0.52, py=cy+Math.sin(a)*r*0.52;
    const g=ctx.createRadialGradient(px-r*0.1,py-r*0.15,r*0.05,px,py,r*0.5);
    g.addColorStop(0,P.l); g.addColorStop(0.6,P.m); g.addColorStop(1,P.d);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,r*0.46,0,6.2832); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.18)'; ctx.lineWidth=1; ctx.stroke();
  }
  const cg=ctx.createRadialGradient(cx-r*0.08,cy-r*0.1,r*0.04,cx,cy,r*0.34);
  cg.addColorStop(0,'#fff4bc'); cg.addColorStop(1,'#e8b83a');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(cx,cy,r*0.32,0,6.2832); ctx.fill();
  ctx.strokeStyle='rgba(140,90,20,0.5)'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}
function drawCell(r,c,idx,alpha,scale){ const [x,y]=cellXY(r,c); drawPuyo(x,y,TS*0.46,idx,alpha,scale); }
// ── 背景＝夜の花園（D4 空間表現）────────────────────────────
// 空・月・遠景の丘・手前の花のシルエット・舞う光の粒を層で重ね、場面（通常/ボス/危機）で空の色が変わる。
// 配置は固定シードの擬似乱数で毎フレーム同じ＝ちらつきなし。
const BGSTARS=[], BGMOTES=[], BGFLOWERS=[];
(function(){ let s=20260722; const rnd=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
  for(let i=0;i<52;i++) BGSTARS.push({x:rnd()*470, y:8+rnd()*300, r:0.5+rnd()*1.3, ph:rnd()*6.283});
  for(let i=0;i<24;i++) BGMOTES.push({x:rnd()*470, y:rnd()*486, r:1+rnd()*2.2, sp:8+rnd()*22, am:6+rnd()*20, ph:rnd()*6.283});
  for(let i=0;i<24;i++) BGFLOWERS.push({x:rnd()*476, y:436+rnd()*44, s:4.5+rnd()*6, c:1+(rnd()*4|0), ph:rnd()*6.283});
})();
function drawGarden(mood){
  const t=clock()/1000, W=C.width, H=C.height;
  // 空
  const sky=ctx.createLinearGradient(0,-10,0,H+10);
  if(mood==='pinch'){      sky.addColorStop(0,'#2c1030'); sky.addColorStop(0.55,'#1c0d26'); sky.addColorStop(1,'#140a18'); }

function wrapCharText(text,cx,y,maxw,lh){
  let line=''; let yy=y;
  for(const ch of text){ const test=line+ch;
    if(ctx.measureText(test).width>maxw && line){ ctx.fillText(line,cx,yy); line=ch; yy+=lh; } else line=test; }
  if(line){ ctx.fillText(line,cx,yy); yy+=lh; }
  return yy;
}

function update(dt){

    fallInterval=Math.max(MINFALL, BASEFALL*enemy.fallMul);
    enemy.atkAcc+=dt;
    if(enemy.atkAcc>=enemy.atk){ enemy.atkAcc=0; pendingGarbage+=enemy.gpa; enemy.warn=clock(); Audio.warn(); shake(4); screenFlash('#ff5d5d',0.10,0.3); }  // 敵の攻撃予告（D2）
  } else {
    const prog = totalCleared*0.7 + playMs/3500;          // 消去数＋時間で少しずつ加速
    const nl = 1+Math.floor(prog/5);
    if(nl>level) Audio.levelUp();                         // 花園が育った合図（M4）
    level = nl;
    fallInterval = Math.max(MINFALL, BASEFALL*Math.pow(0.955, prog));
  }
  if(!cur) return;
  if(dasDir!==0){ dasTimer+=dt;
    if(!dasCharged){ if(dasTimer>=DAS){ dasCharged=true; dasTimer=0; doMove(dasDir); } }
    else if(dasTimer>=ARR){ dasTimer=0; doMove(dasDir); } }
  const onGround=!canPlace(cur.ax,cur.ay+1,cur.rot);
  if(onGround){ lockAcc+=dt; if(lockAcc>=LOCK_DELAY){ lockPiece(); return; } }
  else { lockAcc=0; lockResets=0; fallAcc+=dt; const itv=softDrop?SOFT_FALL:fallInterval;
    if(fallAcc>=itv){ fallAcc=0; tryDown(); } }
}

    case 'ArrowLeft':  dasDir=-1; dasTimer=0; dasCharged=false; doMove(-1); break;
    case 'ArrowRight': dasDir=1;  dasTimer=0; dasCharged=false; doMove(1);  break;

  press($('bRotL'), ()=>{ if(playing()) doRotate(-1); });
  press($('bRotR'), ()=>{ if(playing()) doRotate(1); });
  // 高速落下（押している間）
  press($('bDown'), ()=>{ if(playing()) softDrop=true; }, ()=>{ softDrop=false; });
  // 落とす／決定
  press($('bDrop'), ()=>{
    if(state==='howto'){ confirmHowTo(); return; }
    if(state==='title'){ start(MODES[menuIdx].key); return; }
    if(state==='over'){ state='title'; Audio.cursor(); return; }
    if(playing()) hardDrop();
  });
  // システム
  press($('bPause'), ()=>{ if(state==='play'||state==='pause'){ state = state==='play'?'pause':'play'; Audio.pauseSfx(state==='pause'); } });
  press($('bMute'),  ()=>{ Audio.toggle(); });
  press($('bRestart'), ()=>{ if(state!=='title') start(mode); });
})();
</script>
</body>
</html>
