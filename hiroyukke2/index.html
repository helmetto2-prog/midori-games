<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ひろゆっけ２ 〜論破クエスト〜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0c1024; display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; padding:6px; font-family:'Segoe UI','MS PGothic',sans-serif;
         -webkit-text-size-adjust:100%; overscroll-behavior:none; }
  canvas { display:block; box-shadow:0 0 36px rgba(120,150,255,0.3); border-radius:8px; cursor:pointer;
           width:100%; max-width:480px; height:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #hint { color:#8aa; font-size:12px; margin-top:8px; text-align:center; line-height:1.5; }
  @media (max-width:520px){ #hint { font-size:11px; } }

<body>
<canvas id="c" width="480" height="720"></canvas>
<div id="hint">📱スマホ: 画面を直接タップ（カード・わざ・どうぐ・ガード）<br>⌨️PC: カード=クリック/123 ／ Q=わざ W=どうぐ G=ガード Space=必殺 ／ R リスタート M 音 P ポーズ</div>
<div id="errbar" style="display:none;position:fixed;left:0;right:0;bottom:0;background:#c62828;color:#fff;font:12px Consolas,monospace;padding:6px 10px;z-index:99;white-space:pre-wrap"></div>
<script>
function showErr(m){ try{ var e=document.getElementById('errbar'); e.style.display='block';
  if (e.textContent.indexOf(m)<0) e.textContent+=m+'\n'; }catch(_){} }
window.onerror=function(msg,src,line,col){ showErr(msg+' @'+line+':'+col); };
window.addEventListener('unhandledrejection',function(ev){ showErr('Promise: '+(ev.reason&&ev.reason.message||ev.reason)); });
</script>
<script>
'use strict';
/* =========================================================================
   ENGINE
   ========================================================================= */
const C = document.getElementById('c'), ctx = C.getContext('2d');
const W = C.width, H = C.height, TAU = Math.PI*2;
const clock = () => performance.now();
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const randi = n => Math.random()*n|0;
const rngPick = arr => arr[randi(arr.length)];

let state = 'title';
let G = null;

// ---- Input ---------------------------------------------------------------
const Input = (function(){
  const keys=new Set(), edge=new Set();
  const BLOCK=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'];
  document.addEventListener('keydown', e=>{ SFX.ensure();
    if (BLOCK.includes(e.code)) e.preventDefault();
    if (!keys.has(e.code)) edge.add(e.code); keys.add(e.code); onKey(e.code); });
  document.addEventListener('keyup', e=>keys.delete(e.code));
  return { held:c=>keys.has(c), pressed:c=>edge.has(c), clearEdges:()=>edge.clear() };
})();

// ---- SFX + BGM -------------------------------------------------------------
const SFX = (function(){
  let ac=null, master=null, on=true, bgmIv=null, bgmStep=0, bgmMode='kid';
  const midi = n => 440*Math.pow(2,(n-69)/12);
  // 論破ゲームの「声」：相手ごとに音色・音程が違い、しゃべると誰か分かる（DQ/UNDERTALE風ボイス）
  const VOICEPROF = {
    hiro:  { base:300, type:'square',   spread:2.0, vol:0.030 },  // ひろゆっけ＝低め・平坦・淡々
    kid:   { base:470, type:'square',   spread:3.4, vol:0.034 },  // ガキ大将＝高く跳ねる
    mind:  { base:400, type:'triangle', spread:2.4, vol:0.030 },  // 意識高い系＝澄んだ早口
    rich:  { base:205, type:'sawtooth', spread:1.6, vol:0.038 },  // 成金＝低くドスの利いた
    mirror:{ base:288, type:'square',   spread:2.2, vol:0.030 },  // 闇ひろゆっけ＝本人より半音低い
  };
  const VWAVE = [0,3,-2,5,-1,2,-3,4];  // しゃべりの抑揚（半音オフセット）
  function tone(f,d,type,v){ if(!ac) return; const t=ac.currentTime+0.01, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g).connect(master); o.start(t); o.stop(t+d+0.03); }
  function slide(f0,f1,d,type,v){ if(!ac) return; const t=ac.currentTime+0.01, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0006,t+d); o.connect(g).connect(master); o.start(t); o.stop(t+d+0.03); }
  function noise(v,freq,d){ if(!ac) return; const t=ac.currentTime+0.01, b=ac.createBuffer(1,2048,ac.sampleRate), dt=b.getChannelData(0);
    for(let i=0;i<dt.length;i++) dt[i]=Math.random()*2-1; const s=ac.createBufferSource(); s.buffer=b;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; const g=ac.createGain();
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+d+0.05); }
  // 場面別BGM：相手ごとに曲調が変わり（教室=無邪気/公園=気取り/道ばた=成金の派手さ）、
  // 大詰め（ミラー戦・相手瀕死）はboss、こちらのメンタル瀕死はpinchで感情を先導する
  const BGM = {
    kid:  { tempo:160, lt:'square',   bt:'triangle', lg:0.045, bg:0.085, drum:'light',
            lead:[72,72,74,76, 76,74,72,74, 71,71,72,74, 74,72,71,null,
                  69,71,72,74, 76,76,74,72, 74,72,74,76, 77,null,76,null],
            bass:[48,null,48,null, 43,null,43,null, 41,null,41,null, 43,null,43,null,
                  45,null,45,null, 41,null,41,null, 43,null,43,null, 48,null,48,null] },
    mind: { tempo:185, lt:'triangle', bt:'triangle', lg:0.06,  bg:0.075, drum:'soft',
            lead:[76,79,81,79, 76,74,72,74, 72,74,76,79, 77,74,72,null,
                  74,77,79,77, 74,72,71,72, 69,72,76,74, 72,71,69,null],
            bass:[45,52,48,52, 41,48,45,48, 43,50,47,50, 45,52,48,52,
                  40,47,43,47, 41,48,45,48, 43,50,47,50, 45,null,45,null] },
    rich: { tempo:150, lt:'sawtooth', bt:'square',   lg:0.04,  bg:0.08,  drum:'punch',
            lead:[79,79,79,76, 79,83,83,81, 79,76,74,76, 79,null,79,null,
                  81,81,81,79, 81,84,84,83, 81,79,76,79, 84,null,83,null],
            bass:[43,43,50,43, 43,43,50,43, 45,45,52,45, 43,43,50,43,
                  41,41,48,41, 43,43,50,43, 45,45,52,45, 43,43,43,43] },
    boss: { tempo:120, lt:'square',   bt:'triangle', lg:0.055, bg:0.10,  drum:'boss',
            lead:[69,72,75,76, 75,72,69,68, 69,72,76,79, 78,76,72,69,
                  71,74,77,80, 79,77,74,71, 80,79,77,76, 75,73,72,71],
            bass:[45,45,45,46, 45,45,45,44, 50,50,50,51, 50,50,50,49,
                  52,52,52,53, 52,52,52,51, 45,45,48,46, 45,44,45,47] },
    pinch:{ tempo:108, lt:'square',   bt:'sawtooth', lg:0.05,  bg:0.09,  drum:'urgent',
            lead:[69,68,69,71, 69,68,67,68, 69,68,69,71, 72,71,69,68,
                  67,66,67,69, 67,66,65,66, 67,68,69,71, 72,73,72,71],
            bass:[45,45,45,45, 44,44,44,44, 45,45,45,45, 43,43,43,43,
                  41,41,41,41, 40,40,40,40, 43,43,43,43, 44,44,45,46] },
  };
  function bgmInterval(){ return (BGM[bgmMode]||BGM.kid).tempo; }
  function tickBGM(){ if(!ac) return; const m=BGM[bgmMode]||BGM.kid, i=bgmStep%32;
    const L=m.lead[i], B=m.bass[i], d=m.drum;
    if(B!=null) tone(midi(B-12), m.tempo<140?0.16:0.22, m.bt, m.bg);
    if(L!=null) tone(midi(L),0.16, m.lt, m.lg);
    if(d==='boss'){ if(L!=null&&i%2===0) tone(midi(L-12),0.12,'sawtooth',0.04);
      if(i%8===0){ tone(midi(33),0.55,'sawtooth',0.05); tone(midi(39),0.55,'sawtooth',0.035); }
      if(i%4===2) noise(0.07,2000,0.04); if(i%2===0) noise(0.03,1100,0.03); if(i%8===0) noise(0.14,150,0.11);
    } else if(d==='urgent'){ if(L!=null&&i%2===0) tone(midi(L-12),0.10,'square',0.035);
      if(i%4===0) noise(0.12,180,0.10); if(i%2===0) noise(0.05,1400,0.04); if(i%8===4) tone(midi(31),0.5,'sawtooth',0.05);
    } else if(d==='punch'){ if(i%4===0) noise(0.11,200,0.08); if(i%4===2) noise(0.06,1500,0.04); if(i%8===0) tone(midi(43),0.3,'square',0.05);
    } else if(d==='soft'){ if(i%8===0) noise(0.05,300,0.10); if(i%4===2) noise(0.02,2000,0.03);
    } else { if(i%8===0) noise(0.10,220,0.09); else if(i%2===0) noise(0.02,1700,0.03); }
    bgmStep=(bgmStep+1)%32;
  }
  return {
    get on(){ return on; },
    ensure(){ try{ if(!ac){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      ac=new A(); master=ac.createGain(); master.gain.value=on?0.2:0; master.connect(ac.destination); }
      if(ac.state==='suspended') ac.resume(); }catch(e){} },
    toggle(){ on=!on; if(master) master.gain.value=on?0.2:0; },
    startBGM(mode){ this.ensure(); this.stopBGM(); bgmMode=mode||'kid'; bgmStep=0; if(ac) bgmIv=setInterval(tickBGM,bgmInterval()); },
    setBGMMode(mode){ if(mode===bgmMode||!bgmIv) return; bgmMode=mode; clearInterval(bgmIv); bgmIv=setInterval(tickBGM,bgmInterval()); },
    stopBGM(){ if(bgmIv){ clearInterval(bgmIv); bgmIv=null; } },
    talk(){ tone(300+randi(60),0.05,'square',0.04); },
    // 一文字ぶんの「声」。prof=hiro/kid/mind/rich/mirror、iで抑揚が変わる
    voice(prof,i){ if(!ac) return; const P=VOICEPROF[prof]||VOICEPROF.hiro;
      const w=VWAVE[(i||0)%VWAVE.length]*(P.spread/3);
      tone(P.base*Math.pow(2,w/12),0.05,P.type,P.vol); noise(P.vol*0.35,3200,0.02); },
    // 短いセリフを n 音ぶん続けてしゃべる（吹き出しが一気に出る場面用）
    say(prof,n){ if(!ac) return; n=n||3; for(let k=0;k<n;k++){ const kk=k; setTimeout(()=>this.voice(prof,kk),k*62); } },
    beat(){ tone(200,0.08,'triangle',0.05); noise(0.03,600,0.05); },
    tick(){ tone(880,0.03,'square',0.04); },
    zap(n){ const b=520*Math.pow(1.1,(n||1)-1); tone(b,0.09,'square',0.1); tone(b*1.5,0.14,'square',0.08); noise(0.12,2200,0.06); },
    dull(){ tone(240,0.1,'triangle',0.06); },
    buzz(){ noise(0.25,300,0.18); tone(140,0.18,'sawtooth',0.09); },
    cutin(){ slide(300,1200,0.18,'square',0.08); noise(0.1,2600,0.1); },
    appear(){ slide(150,600,0.25,'triangle',0.09); tone(660,0.12,'square',0.06); },
    defeat(){ slide(800,120,0.5,'sawtooth',0.12); noise(0.3,400,0.35); },
    heal(){ [72,76,79].forEach((m,i)=>setTimeout(()=>tone(midi(m),0.15,'triangle',0.08), i*90)); },
    lvup(){ const seq=[60,64,67,72,76];
      seq.forEach((m,i)=>setTimeout(()=>{ tone(midi(m),0.16,'square',0.1); tone(midi(m-5),0.14,'triangle',0.045); }, i*90));
      setTimeout(()=>{ tone(midi(88),0.3,'square',0.08); noise(0.08,3000,0.15); }, seq.length*90+40); },   // DQ風レベルアップ（二声化+きらめき追加）
    coin(){ tone(1180,0.06,'square',0.06); tone(1580,0.1,'square',0.05); },
    buy(){ tone(880,0.07,'square',0.07); tone(1320,0.1,'triangle',0.05); },
    menu(){ tone(1040,0.04,'square',0.05); },
    guard(){ tone(320,0.12,'triangle',0.08); noise(0.06,900,0.08); },
    eSpecial(){ slide(900,180,0.5,'sawtooth',0.13); noise(0.2,500,0.3); },
    crowd(){ noise(0.1,1200,0.35); noise(0.08,800,0.4); },
    comboFinish(){ [76,79,84].forEach((m,i)=>setTimeout(()=>{ tone(midi(m),0.14,'square',0.1); tone(midi(m+7),0.12,'triangle',0.05); }, i*70));
      setTimeout(()=>{ noise(0.15,2400,0.2); tone(midi(96),0.2,'square',0.06); }, 260); },   // 3連続クリティカル専用ジングル
    special(){ [60,64,67,72,76].forEach((m,i)=>setTimeout(()=>{ tone(midi(m),0.22,'square',0.13); tone(midi(m+12),0.18,'triangle',0.06); }, i*80));
      setTimeout(()=>{ noise(0.3,1800,0.25); slide(1400,300,0.4,'sawtooth',0.1); }, 420); },
    win(){ const seq=[60,64,67,72,76,79,84];
      seq.forEach((m,i)=>setTimeout(()=>{ tone(midi(m),0.24,'square',0.12); tone(midi(m-12),0.22,'triangle',0.06); }, i*115));
      setTimeout(()=>{ [60,64,67,72].forEach(m=>tone(midi(m),0.9,'triangle',0.08)); tone(midi(84),1.0,'square',0.07); }, seq.length*115+80); },
    lose(){ const seq=[67,63,60,55,48];
      seq.forEach((m,i)=>setTimeout(()=>tone(midi(m),0.3,'sawtooth',0.13), i*150));
      setTimeout(()=>{ tone(midi(36),1.1,'sawtooth',0.1); tone(midi(43),1.1,'triangle',0.06); noise(0.08,220,0.6); }, seq.length*150+60); },
  };
})();

// ---- FX --------------------------------------------------------------------
let hitstopT=0;
function hitstop(ms){ hitstopT=Math.max(hitstopT,ms); }
const FX = (function(){
  let parts=[], shake=0, nums=[], rings=[];
  function star(cx,cy,r,rot){ ctx.beginPath();
    for(let i=0;i<5;i++){ const a=rot+i*TAU/5-Math.PI/2, a2=rot+(i+0.5)*TAU/5-Math.PI/2;
      const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r, qx=cx+Math.cos(a2)*r*0.42, qy=cy+Math.sin(a2)*r*0.42;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); ctx.lineTo(qx,qy); }
    ctx.closePath(); }
  return {
    burst(x,y,col,count,spd,shapes){ count=count||8; spd=spd||1; for(let i=0;i<count;i++){ const a=Math.random()*TAU, s=(1.5+Math.random()*3.5)*spd;
      parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,col:col||'#fff',life:0,dur:0.4+Math.random()*0.4,
        rot:Math.random()*TAU,vr:(Math.random()-0.5)*0.3,star:shapes==='star'&&Math.random()<0.5,sz:2.4+Math.random()*2.4}); } },
    shake(amt){ shake=Math.max(shake,amt); },
    ring(x,y,col,r0){ rings.push({x,y,r:r0||8,life:0,dur:0.38,col:col||'#fff'}); },
    popup(x,y,text,col,size){ nums.push({x,y,text,col:col||'#fff',size:size||20,life:0,dur:0.85,vy:-1.5+Math.random()*-0.4}); },
    update(dt){ const f=dt/16;
      for(const p of parts){ p.life+=dt/1000; p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=0.35*f; p.rot+=p.vr*f; }
      parts=parts.filter(p=>p.life<p.dur);
      for(const r of rings){ r.life+=dt/1000; r.r+=(70)*f/16*1; }
      rings=rings.filter(r=>r.life<r.dur);
      for(const n of nums){ n.life+=dt/1000; n.y+=n.vy*f; n.vy=Math.min(n.vy+0.03*f,-0.3); }
      nums=nums.filter(n=>n.life<n.dur);
      shake=Math.max(0,shake-dt/16); },
    preDraw(){ if(shake>0){ ctx.save(); ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); } },
    postDraw(){ if(shake>0) ctx.restore();
      for(const r of rings){ ctx.save(); ctx.globalAlpha=Math.max(0,1-r.life/r.dur)*0.8;
        ctx.strokeStyle=r.col; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,TAU); ctx.stroke(); ctx.restore(); }
      for(const p of parts){ ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.dur);
        ctx.fillStyle=p.col;
        if(p.star){ ctx.translate(p.x,p.y); star(0,0,p.sz*1.8,p.rot); ctx.fill(); }
        else { ctx.beginPath(); ctx.arc(p.x,p.y,p.sz,0,TAU); ctx.fill(); }
        ctx.restore(); }
      for(const n of nums){ const p=n.life/n.dur, pop=p<0.18?(p/0.18):1;
        ctx.save(); ctx.globalAlpha=Math.max(0,1-Math.max(0,p-0.55)/0.45);
        ctx.textAlign='center'; ctx.font='bold '+Math.round(n.size*(0.7+0.3*pop))+'px "Segoe UI"';
        ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillText(n.text,n.x+2,n.y+2);
        ctx.fillStyle=n.col; ctx.fillText(n.text,n.x,n.y);
        ctx.restore(); } },
    clear(){ parts=[]; shake=0; nums=[]; rings=[]; },
  };
})();

// ---- Store（file://のlocalStorage例外ガード） -------------------------------
const Store = { key:'hiroyuki2_best', mem:0,
  get(){ try{ return +(localStorage.getItem(this.key)||0); }catch(e){ return this.mem; } },
  set(v){ this.mem=v; try{ localStorage.setItem(this.key,v); }catch(e){} } };
const StoreRank = { key:'hiroyuki2_rank', mem:'',
  get(){ try{ return localStorage.getItem(this.key)||''; }catch(e){ return this.mem; } },
  set(v){ this.mem=v; try{ localStorage.setItem(this.key,v); }catch(e){} } };
// 到達最深話（負けた日も残る物差し）と称号『無敗の論客』＝ノーコンティニュー制覇
const StoreDeep = { key:'hiroyuki2_deep', mem:0,
  get(){ try{ return +(localStorage.getItem(this.key)||0); }catch(e){ return this.mem; } },
  set(v){ this.mem=v; try{ localStorage.setItem(this.key,v); }catch(e){} } };
const StoreNoCon = { key:'hiroyuki2_nocon', mem:0,
  get(){ try{ return +(localStorage.getItem(this.key)||0); }catch(e){ return this.mem; } },
  set(v){ this.mem=v; try{ localStorage.setItem(this.key,v); }catch(e){} } };
// 📓くせノート＝論破した論客の「口ぐせの内訳」を書きとめる永続コレクション（4人ぶんのビット）
// 一度書きとめた相手とは、次の周から 👁読みメモ に くせの棒グラフ が出る＝周回のごほうび。
const StoreNote = { key:'hiroyuki2_note', mem:0,
  get(){ try{ return +(localStorage.getItem(this.key)||0); }catch(e){ return this.mem; } },
  set(v){ this.mem=v; try{ localStorage.setItem(this.key,v); }catch(e){} } };
// 🐢じっくりモード＝考える時間をのばし、仕切りなおしの回数も増やす（永続設定）
const StoreSlow = { key:'hiroyuki2_slow', mem:0,
  get(){ try{ return +(localStorage.getItem(this.key)||0); }catch(e){ return this.mem; } },
  set(v){ this.mem=v; try{ localStorage.setItem(this.key,v); }catch(e){} } };
function markDeep(idx){ const d=idx+1; if (d>StoreDeep.get()) StoreDeep.set(d); }
function noteHas(i){ return (StoreNote.get() >> i) & 1; }
function noteCount(){ let n=0, b=StoreNote.get(); for (let i=0;i<4;i++) if ((b>>i)&1) n++; return n; }
function noteAdd(i){ const b=StoreNote.get(); if (!((b>>i)&1)) StoreNote.set(b | (1<<i)); }
function slowOn(){ return StoreSlow.get()===1; }

function rrect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function overlay(title,col,sub,sub2){ ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(0,0,W,H); ctx.textAlign='center';
  ctx.fillStyle=col; ctx.font='bold 40px "Segoe UI"'; ctx.fillText(title,W/2,H/2-24);
  ctx.fillStyle='#ddd'; ctx.font='15px "Segoe UI"'; ctx.fillText(sub,W/2,H/2+18);
  if (sub2){ ctx.fillStyle='#9fb0e8'; ctx.font='14px "Segoe UI"'; ctx.fillText(sub2,W/2,H/2+46); } }

let lastT=0;
function loop(t){ const dt = lastT ? Math.min(50,t-lastT) : 16; lastT=t;
  if (hitstopT>0){ hitstopT=Math.max(0,hitstopT-dt); requestAnimationFrame(loop); return; }
  try {
    if (state==='play') update(dt);
    FX.update(dt); render(); Input.clearEdges();
  } catch(err){ showErr(err.message+' ['+((err.stack||'').split('\n')[1]||'').trim()+']'); }
  requestAnimationFrame(loop); }

// v16まで主張タイプは毎ターン `rngPick(TAGKEYS)` の完全ランダムで、
// 4人とも まったく同じ喋りかたをしていた＝2話目からの「？？？」は

// 論客ごとに主張の重みを与え、それを一言で言いあてる「口ぐせ」を添える。
const HABIT = [
  { w:{ emotion:5, dodge:3, nodata:1, authority:1 }, hint:'とにかく感情でおしてくる。ときどき話をそらす。' },
  { w:{ authority:4, nodata:4, dodge:1, emotion:1 }, hint:'肩書きと断言ばかり。感情はほとんど出さない。' },
  { w:{ dodge:4, authority:3, emotion:2, nodata:1 }, hint:'話をそらしながら、えらい人の名前を出す。' },
  { w:{ emotion:1, nodata:1, dodge:1, authority:1 }, hint:'よみきれない。４タイプを おなじだけ 使ってくる。' },
];
function habitOf(){ return HABIT[clamp(G.enemyIdx,0,HABIT.length-1)]; }
function pickTag(){
  const w=habitOf().w; let sum=0;
  for (const k of TAGKEYS) sum+=(w[k]||0);
  let r=Math.random()*sum;
  for (const k of TAGKEYS){ r-=(w[k]||0); if (r<0) return k; }
  return TAGKEYS[TAGKEYS.length-1];
}

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=randi(i+1); [a[i],a[j]]=[a[j],a[i]]; } }

function drawCards(){
  while (G.hand.length<3){
    if (!G.deck.length){
      if (!G.discard.length) break;
      G.deck=G.discard; G.discard=[]; shuffle(G.deck);
      msg('すてふだを きりなおした！');
    }
    G.hand.push(G.deck.pop());
  }
}

function prepArgument(){
  const en=enemy();
  const tag=pickTag();
  const text = en.style==='mirror' ? rngPick(MIRROR_ARGS[tag]) : rngPick(ARGS[tag]);
  G.arg={ tag, text };
  G.mutter=rngPick(MUTTERS[tag]);
  for (const c of G.hand) c.sealed=false;
  drawCards();
  G.sel=-1; G.reply=null; G.result=null; G.pending=null;
}

  G.phase='select'; G.menu=null;
  const base = CONFIG.selectMs * (slowOn()?CONFIG.slowMul:1);   // 🐢じっくりモードは考える時間がのびる
  G.selectT = G.timerHalf ? base/2 : base;

  SFX.say(enemy().style, 3);   // 相手が主張を「しゃべって」から手番が来る
}

  G.hPose='windup'; G.hMood=0.2; G.ePose='smug'; G.eMood=0.5;

function playCard(idx){
  if (state!=='play'||G.phase!=='select') return;
  if (idx<0||idx>=G.hand.length) return;
  const card=G.hand[idx];
  if (card.sealed){ msg('そのカードは ふうじられている！'); SFX.buzz(); return; }
  G.sel=idx;
  const match = card.wild || (card.strong && card.strong===G.arg.tag);
  let kind,dmg,self=0,gaugeAdd;
  if (match){ kind='crit'; dmg=(26+G.combo*5)*card.mul; gaugeAdd=30+(card.gaugeB||0); }
  else if (!card.strong){ kind='mild'; dmg=15*card.mul; gaugeAdd=12+(card.gaugeB||0); }
  else { kind='miss'; dmg=7; self=enemy().atk+randi(6); gaugeAdd=6; }
  beginAction({kind,dmg:Math.round(dmg),self,gaugeAdd,special:false,card}, {opener:rngPick(OPENERS), line:rngPick(card.bubbles)});
  G.hand.splice(idx,1); G.discard.push(card); G.sel=-1;
}
function unleashSpecial(){

      msg('かいしんの ろんぱ！ '+en.name+'に '+dmg+'の ダメージ！'); G.exp+=8; G.gold+=15; }

    G.hMood=1; G.hPose = p.special?'ronpa':'point'; G.eMood=-1; G.ePose='shock'; G.shakeE=14; G.eBump=1; G.speaker='hiro';
    G.audience=clamp(G.audience+(p.special?20:12),0,100);
    G.streak++;
    if (G.streak>=3){ G.streak=0; G.myHP=clamp(G.myHP+15,0,G.myMax); G.audience=clamp(G.audience+20,0,100);
      msg('３れんぞく クリティカル！ ぎだいを せいした！ メンタル +15'); SFX.crowd(); SFX.comboFinish(); FX.popup(110,150,'+15','#7dffb0',20); }
    G.cutin={ t:540, dur:540, text: p.special?(p.spLine||'はい、論破。'):rngPick(TAUNT_CRIT), special:p.special };

  } else {
    G.combo=0; G.streak=0; m=rngPick(COMEBACK); col='#ff7a7a'; FX.burst(110,240,'#ff7a7a',14); FX.ring(110,196,'#ff7a7a',8); SFX.buzz(); hitstop(35);
    FX.popup(110,150,'-'+p.self,'#ff9c9c',22);
    G.hMood=-0.7; G.hPose='guard'; G.eMood=1; G.ePose='angry'; G.shakeH=14; FX.shake(6); G.speaker='enemy';
    G.audience=clamp(G.audience-10,0,100);
    G.eGauge=clamp(G.eGauge+14,0,100);
    msg('しかし かみあっていない！ はんげきで ひろゆっけに '+p.self+'の ダメージ！');
  }
  // カード追加効果
  if (p.card){
    if (p.card.heal){ G.myHP=clamp(G.myHP+p.card.heal,0,G.myMax); msg('メンタルが '+p.card.heal+' かいふくした！'); }
    if (p.card.drain && p.kind!=='miss'){ G.eGauge=clamp(G.eGauge-p.card.drain,0,100); msg(en.name+'の ゲージを '+p.card.drain+' けずった！'); }
  }
  // タイプ公開（推理の答え合わせ）＋読みメモへ記録
  if (G.seen && G.arg) G.seen[G.arg.tag]=(G.seen[G.arg.tag]||0)+1;
  if (tagHidden()) msg('（いまの主張は「'+TAGS[G.arg.tag].name+'」だった）');
  G.oppHP=clamp(G.oppHP-dmg,0,en.hp);
  if (p.self) G.myHP=clamp(G.myHP-p.self,0,G.myMax);

  G.eGauge=clamp(G.eGauge+en.gaugeRate,0,100);
  G.result={ msg:m,col,dmg,self:p.self,special:p.special,
    hiroSub: p.kind==='miss' ? rngPick(HURT_LINES) : null };
  G.phase='result'; G.timer=CONFIG.resultMs;
  checkLevel();
}

function checkLevel(){
  while (G.exp>=G.expNext){
    G.exp-=G.expNext; G.lv++;
    G.expNext=Math.round(G.expNext*1.5+10);
    G.myMax+=10; G.myHP=clamp(G.myHP+20,0,G.myMax);
    msg('ひろゆっけは レベル'+G.lv+'に あがった！ さいだいメンタル +10');
    SFX.lvup(); FX.burst(110,200,'#7dff9a',26,1.4,'star'); FX.ring(110,196,'#7dff9a',10); FX.popup(110,140,'LEVEL UP!','#7dff9a',22); hitstop(60);
  }
}

// ---- 観客の乱入（話ごとに1回・戦闘を1.6秒だけ止めて盤面を動かす）--------------
function beginEvent(){
  G.evFired=true;
  const ev=EVENTS[G.enemyIdx];
  if (!ev){ prepArgument(); toSelect(); return; }
  G.ev=ev; G.phase='event'; G.timer=CONFIG.eventMs;
  ev.fn();                       // 効果は表示と同時に反映（数値はHUDのバーにすぐ出る）
  msg(ev.line); msg(ev.sub);
  G.speaker='enemy';
  FX.ring(370,196,ev.col,10); FX.shake(5);
  SFX.beat(); SFX.menu();
}

const RANKS=['C','B','A','S'];
function calcRank(){
  const pts = G.myHP + G.maxCombo*15 - G.turn*3 + Math.floor(G.audience/5);
  let r = pts>=120?'S' : pts>=85?'A' : pts>=45?'B' : 'C';
  // 仕切り直した回数ぶんランクを下げる＝Sは「一度も戻らずに討ち切った証」として守る
  if (G.usedContinue){ const used=CONFIG.retryMax-G.retries;
    r = RANKS[clamp(RANKS.indexOf(r)-used,0,3)]; }
  return r;
}

// ---- Update -------------------------------------------------------------------
function update(dt){
  G.blinkT-=dt; if (G.blinkT<=0){ G.blink=140; G.blinkT=2200+randi(2200); } if (G.blink>0) G.blink-=dt;
  if (G.shakeE>0) G.shakeE=Math.max(0,G.shakeE-dt/16);
  if (G.shakeH>0) G.shakeH=Math.max(0,G.shakeH-dt/16);
  if (G.flash>0)  G.flash=Math.max(0,G.flash-dt/500);
  if (G.eBump>0)  G.eBump=Math.max(0,G.eBump-dt/700);
  if (G.punch>0)  G.punch=Math.max(0,G.punch-dt/420);
  if (G.healMsg>0) G.healMsg-=dt;
  if (G.epi>0) G.epi-=dt;
  if (G.cutin){ G.cutin.t-=dt; if (G.cutin.t<=0) G.cutin=null; }
  SFX.setBGMMode(stageMode());

  if (G.phase==='intro'){
      // 相手が名乗る→ひろゆっけが受ける、を声の掛け合いで（吹き出しの出るタイミングに合わせる）
      if (G.introVoice===0 && G.timer < CONFIG.introMs*0.86){ SFX.say(enemy().style,4); G.introVoice=1; }
      else if (G.introVoice===1 && G.timer < CONFIG.introMs*0.5){ SFX.say('hiro',3); G.introVoice=2; }
      G.timer-=dt; if (G.timer<=0) toSelect(); }
  else if (G.phase==='select'){
    const prev=G.selectT; G.selectT-=dt;
    if (G.selectT<=3000 && Math.ceil(prev/1000)!==Math.ceil(G.selectT/1000)) SFX.tick();
    if (G.selectT<=0) timeoutAttack();
  }
  else if (G.phase==='tame'){ G.timer-=dt; if (G.timer<=0){ G.phase='reply'; G.timer=CONFIG.replyMs; G.hPose=G.pending.special?'ronpa':'point'; G.voiceN=0; SFX.talk(); } }
  else if (G.phase==='reply'){ G.timer-=dt;
      // ひろゆっけの返しを一文字ずつ「しゃべる」＝論破の核が無音だったのを解消（吹き出しの表示と同期）
      const line=G.reply.line||'', prog=1-G.timer/CONFIG.replyMs;
      const n=Math.max(1,Math.ceil(line.length*clamp(prog*1.6,0,1)));
      if (n>G.voiceN){ for (let k=G.voiceN;k<n;k++){ const ch=line[k];
          if (ch && k%2===0 && '。、！？…「」　 '.indexOf(ch)<0) SFX.voice('hiro',k); }
        G.voiceN=n; }
      if (G.timer<=0){ G.phase='hold'; G.timer=CONFIG.holdMs; SFX.beat(); } }
  else if (G.phase==='hold'){ G.timer-=dt; if (G.timer<=0) applyPending(); }
  else if (G.phase==='result'){ G.timer-=dt; if (G.timer<=0){
      if (G.oppHP<=0){ if (G.enemyIdx>=ENEMIES.length-1){ win(); } else { beginDefeat(); } return; }
      if (G.myHP<=0){ lose(); return; }
      if (G.eGauge>=100){ beginEnemyAtk(); return; }
      // 中盤の山場：相手のメンタルが半分を割った最初の一度だけ観客が乱入する
      if (!G.evFired && G.oppHP>0 && G.oppHP <= enemy().hp*0.5){ beginEvent(); return; }
      prepArgument(); toSelect(); } }
  else if (G.phase==='event'){ G.timer-=dt; if (G.timer<=0){ prepArgument(); toSelect(); } }
  else if (G.phase==='enemyatk'){ G.timer-=dt; if (G.timer<=0){
      if (G.myHP<=0){ lose(); return; }
      prepArgument(); toSelect(); } }
  else if (G.phase==='defeat'){ G.timer-=dt; if (G.timer<=0) openShop(); }
  // shop / cardpick は入力待ち
}

// ---- Mouse / Touch --------------------------------------------------------
let mouse={x:-1,y:-1}, touching=false;
function setCursor(cx,cy){ const r=C.getBoundingClientRect();
  mouse.x=(cx-r.left)*(W/r.width); mouse.y=(cy-r.top)*(H/r.height); }
C.addEventListener('mousemove', e=>{ touching=false; setCursor(e.clientX,e.clientY); });
// タッチ端末はmousemoveが無くカーソルが(-1,-1)のままなので、指の位置をclick前に反映する
C.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; if(!t) return;
  touching=true; setCursor(t.clientX,t.clientY); SFX.ensure(); }, {passive:true});
C.addEventListener('click', ()=>{
  SFX.ensure();
  if (state==='continue'){ doContinue(); return; }
  // タイトルの 🐢じっくりモード は、スタートさせずに切替だけ行う（指でも押せるよう判定を広げる）
  if (state==='title' && inRect(mouse,tapPad(slowRect()))){ toggleSlow(); return; }
  if (state==='title'||state==='over'){ startGame(); return; }
  if (state!=='play'||!G) return;
  if (G.phase==='shop'){
    for (let i=0;i<SHOP_STOCK.length;i++){ const r=shopRowRect(i); if (inRect(mouse,r)){ buyItem(i); return; } }
    if (inRect(mouse,shopExitRect())){ openCardPick(); return; }
    return;
  }
  if (G.phase==='cardpick'){
    for (let i=0;i<3;i++){ const x=cardX(i); if (mouse.y>=CARD.y&&mouse.y<=CARD.y+CARD.h&&mouse.x>=x&&mouse.x<=x+CARD.w){ pickReward(i); return; } }
    return;
  }
  if (G.phase!=='select') return;
  // メニュー（わざ/どうぐ）
  if (G.menu){
    const entries = menuEntries();
    for (let i=0;i<entries.length;i++){ if (inRect(mouse,menuRowRect(i))){ entries[i].fn(); return; } }
    G.menu=null; return;
  }
  // コマンドボタン（指では26pxが狭いのでタッチ時だけ判定を上下6px広げる）
  for (let i=0;i<CMDS.length;i++){ if (inRect(mouse,tapPad(cmdRect(i)))){ CMDS[i].fn(); return; } }
  const i=cardAt(mouse.x,mouse.y); if (i>=0) playCard(i);
});
function inRect(m,r){ return m.x>=r.x&&m.x<=r.x+r.w&&m.y>=r.y&&m.y<=r.y+r.h; }
function tapPad(r){ if(!touching) return r; const p=6; return { x:r.x-4, y:r.y-p, w:r.w+8, h:r.h+p*2 }; }

function cardAt(mx,my){ if (my<CARD.y||my>CARD.y+CARD.h) return -1;
  for (let i=0;i<G.hand.length;i++){ const x=cardX(i); if (mx>=x&&mx<=x+CARD.w) return i; } return -1; }

function menuEntries(){
  if (G.menu==='skill') return [

// ---- 空間表現（奥行きレイヤー）------------------------------------------------
// 「遠景＝背景画 ／ 中景＝ふたり ／ 近景＝手前のシルエット」の3層を別々の速さで
// 動かし（パララックス）、地平の靄・消失点へ収束する床線・被写界深度のぼかしで
// 平面の絵を「奥行きのある部屋の中」に見せる。
function camX(depth){
  const sway = Math.sin(clock()/2600)*6 + Math.sin(clock()/930)*1.8;
  const kick = G ? (G.punch||0)*9 : 0;      // 会心・必殺のときカメラが前に踏み込む
  return (sway+kick)*depth;
}
const DEPTH = {
  classroom:{ haze:'rgba(233,220,192,0.55)', line:'rgba(90,60,30,0.30)', fore:'#3a2b1c', mote:'#ffffff' },
  park:     { haze:'rgba(216,240,255,0.55)', line:'rgba(30,70,25,0.26)', fore:'#1d3d1c', mote:'#ffffff' },
  street:   { haze:'rgba(255,222,170,0.50)', line:'rgba(255,255,255,0.18)', fore:'#2a2118', mote:'#ffe9c0' },
  studio:   { haze:'rgba(90,70,140,0.40)',   line:'rgba(180,150,255,0.20)', fore:'#07060f', mote:'#ffe9b0' },
};
function depthOf(sc){ return DEPTH[sc]||DEPTH.classroom; }
// 背景の上に重ねる奥行き（床のパース線＋地平の靄）。人物より奥に描かれる。
function drawDepth(sc,a){
  const D=depthOf(sc), hz=GROUND+2, fb=a.y+a.h-hz;
  // 奥ほど暗く沈む（空気遠近法）＝色味は変えず影だけ重ねる
  const fg=ctx.createLinearGradient(0,hz,0,a.y+a.h);
  fg.addColorStop(0,'rgba(0,0,0,0.32)'); fg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=fg; ctx.fillRect(a.x,hz,a.w,fb);
  // 消失点へ収束する床の線＋手前ほど間隔の広がる横線
  const vx=W/2+camX(0.5), vy=hz-96;
  ctx.save(); ctx.beginPath(); ctx.rect(a.x,hz,a.w,fb+2); ctx.clip();
  ctx.strokeStyle=D.line; ctx.lineWidth=1.2;
  for (let i=-7;i<=7;i++){ ctx.beginPath(); ctx.moveTo(vx,vy);
    ctx.lineTo(vx+i*118+camX(1.1), a.y+a.h+6); ctx.stroke(); }
  for (let k=1;k<=4;k++){ const t=k/5, y=hz+fb*(t*t);
    ctx.globalAlpha=0.5*(1-t*0.5); ctx.beginPath(); ctx.moveTo(a.x,y); ctx.lineTo(a.x+a.w,y); ctx.stroke(); }
  ctx.restore();
  // 地平線の靄（遠くほど霞む）
  const hg=ctx.createLinearGradient(0,hz-36,0,hz+6);
  hg.addColorStop(0,'rgba(255,255,255,0)'); hg.addColorStop(1,D.haze);
  ctx.fillStyle=hg; ctx.fillRect(a.x,hz-36,a.w,42);
}
// 人物より手前の層。いちばん速く動くので「自分もその場にいる」感じが出る。
function drawSceneFore(sc,name){
  const a=ARENA, D=depthOf(sc), b=a.y+a.h;
  ctx.save(); ctx.beginPath(); rrect(a.x+8,a.y,a.w-16,a.h,10); ctx.clip();
  ctx.save(); ctx.translate(camX(1.6),0);
  ctx.fillStyle=D.fore;
  if (sc==='classroom'){
    // 手前の席＝カメラは教室のうしろの席から見ている
    for (const x of [-40,120,300,450]){
      rrect(x,b-26,132,9,3); ctx.fill();
      ctx.fillRect(x+16,b-18,8,26); ctx.fillRect(x+106,b-18,8,26);
    }
  } else if (sc==='park'){
    ctx.beginPath(); ctx.moveTo(a.x-20,b+8);
    for (let i=0;i<=27;i++){ const x=a.x-20+i*20;
      ctx.lineTo(x, b-8-(i%3)*9-Math.abs(Math.sin(i*1.7))*17); }
    ctx.lineTo(a.x+a.w+20,b+8); ctx.closePath(); ctx.fill();
  } else if (sc==='street'){
    ctx.fillRect(a.x-10,b-12,a.w+20,20);                      // 手前の縁石
    rrect(-70,b-56,120,50,10); ctx.fill();                    // 停まっている車の後ろ姿
    ctx.fillStyle='rgba(255,90,80,0.85)'; ctx.fillRect(-4,b-40,16,9); ctx.fillRect(28,b-40,16,9);
  } else {
    // 観覧席の後頭部＝討論番組をうしろから見ている画
    for (const [x,r] of [[36,32],[168,26],[318,28],[452,34]]){
      ctx.beginPath(); ctx.arc(x,b+10,r,Math.PI,TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x,b+18,r*1.55,r*0.95,0,Math.PI,TAU); ctx.fill();
    }
  }
  ctx.restore();
  // 空気中のちり（近景でゆっくり流れる）
  const tt=clock()/1000;
  for (let i=0;i<14;i++){
    const sp=0.25+(i%5)*0.06, dx=((i*79+tt*22*sp)%520)-20;
    const dy=a.y+14+((i*53+Math.sin(tt*0.6+i)*12)%(a.h-28));
    ctx.globalAlpha=0.10+(i%4)*0.05; ctx.fillStyle=D.mote;
    ctx.beginPath(); ctx.arc(dx+camX(1.2),dy,0.9+(i%3)*0.7,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  // 被写界深度：四隅を落として中央のふたりを浮かせる
  const vg=ctx.createRadialGradient(W/2,a.y+a.h*0.46,70,W/2,a.y+a.h*0.5,300);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.38)');
  ctx.fillStyle=vg; ctx.fillRect(a.x,a.y,a.w,a.h);
  // 名前は最前面に固定表示（手前のシルエットに隠れず、上下の揺れでもブレない）
  if (name!==undefined){
    ctx.textAlign='center'; ctx.font='11px "Segoe UI"';
    for (const [nx,ny,txt,col] of [[110,314,'ひろゆっけ','#dfe6ff'],[370,314,name,'#ffd0d0']]){
      if (!txt) continue;
      const tw=ctx.measureText(txt).width+16;
      ctx.fillStyle='rgba(6,8,20,0.62)'; rrect(nx-tw/2,ny-13,tw,17,8); ctx.fill();
      ctx.fillStyle=col; ctx.fillText(txt,nx,ny);
    }
  }
  ctx.restore();
}

// 被弾/会心の瞬間に人物の背後で光らせる衝撃グロー
function hitFlash(cx,cy,amt,col){
  if (amt<=0) return;
  ctx.save(); ctx.globalAlpha=Math.min(1,amt/16)*0.55;
  const rg=ctx.createRadialGradient(cx,cy,4,cx,cy,64);
  rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,64,0,TAU); ctx.fill();
  ctx.restore();
}

// ---- 吹き出し ------------------------------------------------------------------
function drawBubble(side, tag, text, gold){
  const bw=214, bh=76, y=88;
  const x = side==='left' ? 14 : W-14-bw;
  ctx.fillStyle= gold?'#fff3cc':'#ffffff'; rrect(x,y,bw,bh,14); ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle= gold?'#ffcf4a':(tag?tag.col:'#cfd7ea'); rrect(x,y,bw,bh,14); ctx.stroke();
  ctx.fillStyle=gold?'#fff3cc':'#ffffff';
  if (side==='left'){ ctx.beginPath(); ctx.moveTo(x+40,y+bh); ctx.lineTo(x+30,y+bh+16); ctx.lineTo(x+58,y+bh); ctx.closePath(); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(x+bw-40,y+bh); ctx.lineTo(x+bw-30,y+bh+16); ctx.lineTo(x+bw-58,y+bh); ctx.closePath(); ctx.fill(); }
  let ty=y+22;
  if (tag){ ctx.fillStyle=tag.col; rrect(x+12,y+10,96,20,10); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('相手：'+tag.name,x+12+48,y+24); ty=y+48; }
  ctx.fillStyle= gold?'#7a3d00':'#20263a'; ctx.font='bold 15px "Segoe UI"'; ctx.textAlign='left';
  wrapText(text, x+14, ty, bw-26, 21);
}

function drawMutter(){

  ctx.fillStyle='rgba(18,24,48,0.8)'; rrect(14,92,204,44,12); ctx.fill();
  ctx.setLineDash([5,4]); ctx.strokeStyle='rgba(150,170,255,0.5)'; ctx.lineWidth=1.5; rrect(14,92,204,44,12); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(18,24,48,0.8)';
  ctx.beginPath(); ctx.arc(50,144,5,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(62,152,3,0,TAU); ctx.fill();

}

// ---- 読みメモ ------------------------------------------------------------------
// この論戦で相手が出したタイプの回数。？？？表示のあいだ、消去法と傾向読みの材料になる。
function drawReadMemo(){
  if (!G.seen) return;
  const noted = !!G.noted, bh = noted?37:33;
  ctx.save();
  ctx.fillStyle='rgba(12,18,40,0.85)'; rrect(8,461,124,bh,7); ctx.fill();
  ctx.strokeStyle= noted?'rgba(126,200,255,0.55)':'rgba(150,170,255,0.35)'; ctx.lineWidth=1; rrect(8,461,124,bh,7); ctx.stroke();
  ctx.textAlign='left'; ctx.fillStyle= noted?'#7ec8ff':'#8792bd'; ctx.font='9px "Segoe UI"';
  ctx.fillText(noted?'📓 くせノート済み':'👁 これまでの読み', 13, 471);
  let top=0; for (const k of TAGKEYS) top=Math.max(top,G.seen[k]||0);
  // 📓ノート済みの相手は「くせの内訳」＝実際の抽選ウェイトが棒グラフで見える（周回のごほうび）
  const wt = habitOf().w; let wmax=0; for (const k of TAGKEYS) wmax=Math.max(wmax,wt[k]||0);
  TAGKEYS.forEach((k,i)=>{
    const x=18+i*28, n=G.seen[k]||0, lead=(n>0&&n===top);
    ctx.fillStyle=TAGS[k].col; ctx.globalAlpha=n>0?1:0.35;
    ctx.beginPath(); ctx.arc(x,484,3.5,0,TAU); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle= lead?'#ffe27a':'#c3ccee'; ctx.font=(lead?'bold ':'')+'11px "Segoe UI"';
    ctx.fillText(String(n), x+6, 488);
    if (noted){
      const bw = wmax>0 ? Math.round(22*(wt[k]||0)/wmax) : 0;
      ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fillRect(x-4,491,22,3);
      ctx.fillStyle=TAGS[k].col; ctx.fillRect(x-4,491,bw,3);
    }
  });
  ctx.restore();
}

  ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; rrect(x+2,y+2,w-4,h-4,7); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1; rrect(x+6,y+6,w-12,h-12,5); ctx.stroke();
}
function drawMsgWindow(){
  dqWindow(8,386,W-16,74);
  ctx.font='13px "MS Gothic","Segoe UI",monospace'; ctx.textAlign='left';
  for (let i=0;i<G.msgs.length;i++){
    ctx.fillStyle = i===G.msgs.length-1 ? '#fff' : 'rgba(255,255,255,0.55)';

// ---- Render --------------------------------------------------------------------
function render(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#141a3a'); g.addColorStop(1,'#0c1024');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign='left'; ctx.fillStyle='#ffe27a'; ctx.font='bold 22px "Segoe UI"'; ctx.fillText('ひろゆっけ２',16,30);
  ctx.fillStyle='#8aa'; ctx.font='12px "Segoe UI"'; ctx.fillText('〜論破クエスト〜',146,29);
  ctx.textAlign='right'; ctx.fillStyle=SFX.on?'#7CFC00':'#888'; ctx.font='12px "Segoe UI"'; ctx.fillText((SFX.on?'♪ON':'♪OFF')+' (M)',W-14,20); ctx.textAlign='left';

  if (state==='title'){ renderTitle(); return; }

  const en=enemy();
  // 敵バー＋敵ゲージ
  bar(16,40,W-32,16,G.oppHP/en.hp,'#ff5d7a', en.name+' のメンタル');
  const egr=G.eGauge/100;
  ctx.fillStyle='#0a0f22'; rrect(16,58,W-32,7,3); ctx.fill();
  ctx.fillStyle= egr>=0.8?'#ff3a4a':'#c06cff'; rrect(17,59,(W-34)*egr,5,2); ctx.fill();
  ctx.textAlign='right'; ctx.fillStyle='#ffd0d0'; ctx.font='bold 11px "Segoe UI"';
  ctx.fillText('第'+(G.enemyIdx+1)+'話 / 全'+ENEMIES.length+'話', W-18, 37); ctx.textAlign='left';

  const zoomCX=W/2, zoomCY=ARENA.y+ARENA.h/2, zoomS=1+G.punch*0.05;
  ctx.save(); ctx.translate(zoomCX,zoomCY); ctx.scale(zoomS,zoomS); ctx.translate(-zoomCX,-zoomCY);
  drawScene(en.scene);
  const blink=G.blink>0;
  hitFlash(110,206,G.shakeH,'rgba(255,120,120,0.9)');
  ctx.save(); if (G.shakeH>0) ctx.translate((Math.random()-0.5)*G.shakeH,(Math.random()-0.5)*G.shakeH);
    drawHiro(110,206,G.hMood,G.hPose,blink,true); ctx.restore();
  hitFlash(370,206,G.shakeE,'rgba(255,226,122,0.9)');
  ctx.save();
  if (G.phase==='intro'){ const p=1-G.timer/CONFIG.introMs; ctx.translate((1-Math.min(1,p*1.6))*140,0); }
  if (G.phase==='defeat'){ ctx.globalAlpha=Math.max(0.15,G.timer/CONFIG.defeatMs); ctx.translate((1-G.timer/CONFIG.defeatMs)*30,(1-G.timer/CONFIG.defeatMs)*10); }
  if (G.shakeE>0) ctx.translate((Math.random()-0.5)*G.shakeE,(Math.random()-0.5)*G.shakeE);
  drawEnemy(370,206,G.eMood,G.ePose,blink,G.eBump,en.style,'');
  ctx.restore();
  drawSceneFore(en.scene,en.name);   // ふたりより手前の層＝奥行きの仕上げ
  ctx.restore();

  if (G.phase==='tame' || G.phase==='hold'){
    ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(ARENA.x,ARENA.y,ARENA.w,ARENA.h);
    ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,'+(0.4+0.3*Math.sin(clock()/120))+')';
    ctx.font='bold 20px "Segoe UI"'; ctx.fillText('…', W/2, 150);
  }
  // 敵必殺の予告（ゲージ80%以上でセリフ表示）
  if (G.phase==='select' && G.eGauge>=80){
    ctx.save(); ctx.globalAlpha=0.6+0.4*Math.sin(clock()/150);
    ctx.textAlign='center'; ctx.fillStyle='#ff8a9c'; ctx.font='bold 13px "Segoe UI"';
    ctx.fillText(en.spWarn, W/2, ARENA.y+ARENA.h-8); ctx.restore();
  }

  // 吹き出し
  if (G.phase==='intro'){
    drawBubble('right', null, en.intro, false);
    if (G.timer < CONFIG.introMs*0.55) drawBubble('left', null, G.introReply, false);
  }
  else if (G.phase==='select'){
    drawBubble('right', tagHidden()?HIDDEN_TAG:TAGS[G.arg.tag], G.arg.text, false);
    drawMutter();
  }
  else if (G.phase==='reply' || G.phase==='hold'){
    let line=G.reply.line;
    if (G.phase==='reply'){ const prog=1-G.timer/CONFIG.replyMs; const n=Math.max(1,Math.ceil(line.length*clamp(prog*1.6,0,1))); line=line.slice(0,n); }
    const shown=(G.reply.opener?G.reply.opener+'\n':'')+line;
    drawBubble('left', null, shown, G.pending&&G.pending.special);
  } else if (G.phase==='result'){
    if (G.speaker==='enemy'){
      drawBubble('right', null, G.result.msg, false);
      if (G.result.hiroSub) drawBubble('left', null, G.result.hiroSub, false);
    }
    else drawBubble('left', null, G.result.msg, G.result.special);
  } else if (G.phase==='defeat'){
    drawBubble('right', null, en.defeat, false);
    drawBubble('left', null, G.defeatComment, false);
  } else if (G.phase==='enemyatk'){
    drawBubble('right', null, en.spName+'！！', false);
  }

  // 自分バー・ゲージ・観客
  ctx.save(); if (G.shakeH>0) ctx.translate((Math.random()-0.5)*G.shakeH,0);
    bar(16,334,W-32,16,G.myHP/G.myMax,'#4fd08a','ひろゆっけのメンタル'); ctx.restore();
  drawGauge(16,353,(W-40)/2,11);
  drawAudience(24+(W-40)/2,353,(W-40)/2,11);
  if (G.healMsg>0){ ctx.save(); ctx.globalAlpha=Math.min(1,G.healMsg/500); ctx.fillStyle='#7dffb0';
    ctx.font='bold 13px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('メンタル +'+CONFIG.healBetween+' 回復！', W/2, 330); ctx.restore(); }

  // ステータス行（DQ風）
  ctx.textAlign='left'; ctx.fillStyle='#cdd6ff'; ctx.font='bold 12px "MS Gothic","Segoe UI",monospace';
  ctx.fillText('Lv'+G.lv+'  EXP '+G.exp+'/'+G.expNext+'  '+G.gold+'G  山札'+G.deck.length+'  ターン'+G.turn, 16, 380);
  if (G.combo>=2){ ctx.textAlign='right'; ctx.fillStyle='#ffe27a'; ctx.fillText('🔥'+G.combo+'コンボ', W-16, 380); ctx.textAlign='left'; }

  // メッセージウィンドウ
  drawMsgWindow();

  // 読みメモ（タイプが？？？のあいだだけ・コマンド盤の左あき地）
  if (tagHidden() && G.phase!=='shop' && G.phase!=='cardpick') drawReadMemo();

  // コマンドボタン
  if (G.phase==='select'){
    for (let i=0;i<CMDS.length;i++){
      const r=cmdRect(i); const hover=inRect(mouse,r);
      const special = i===0 && G.gauge>=CONFIG.gaugeMax;
      ctx.fillStyle= special ? '#b3701a' : (hover?'#2c3a6e':'#1c2450'); rrect(r.x,r.y,r.w,r.h,6); ctx.fill();

function drawCardAt(card,x,yy,selectable,hover,num){
  const w=CARD.w, h=CARD.h;
  ctx.save();
  if (!selectable && num!==undefined) ctx.globalAlpha=0.55;
  if (card.sealed) ctx.globalAlpha=0.35;
  ctx.fillStyle='rgba(0,0,0,0.35)'; rrect(x+3,yy+5,w,h,12); ctx.fill();
  const g=ctx.createLinearGradient(0,yy,0,yy+h);
  if (card.wild){ g.addColorStop(0,'#4a3a10'); g.addColorStop(1,'#2a2008'); }
  else { g.addColorStop(0,'#20264a'); g.addColorStop(1,'#171b34'); }
  ctx.fillStyle=g; rrect(x,yy,w,h,12); ctx.fill();
  ctx.lineWidth=hover?3:1.5;
  ctx.strokeStyle= card.wild ? '#ffd24a' : (hover?'#ffe27a':'rgba(150,170,255,0.35)'); rrect(x,yy,w,h,12); ctx.stroke();
  if (num!==undefined){
    ctx.fillStyle=hover?'#ffe27a':'#3b4577'; ctx.beginPath(); ctx.arc(x+20,yy+20,13,0,TAU); ctx.fill();
    ctx.fillStyle=hover?'#20263a':'#dfe6ff'; ctx.font='bold 15px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText((num+1),x+20,yy+25);
  }
  ctx.fillStyle='#f2f5ff'; ctx.font='bold 16px "Segoe UI"'; ctx.textAlign='center';
  card.text.split('\n').forEach((ln,k)=>ctx.fillText(ln,x+w/2,yy+70+k*23));
  // 追加効果表示
  let fx=[];
  if (card.mul&&card.mul>1) fx.push('ダメ x'+card.mul);
  if (card.heal) fx.push('回復+'+card.heal);
  if (card.gaugeB) fx.push('ゲージ+');
  if (card.drain) fx.push('敵ゲージ-');
  if (fx.length){ ctx.fillStyle='#9fe8c0'; ctx.font='11px "Segoe UI"'; ctx.fillText(fx.join(' '), x+w/2, yy+h-42); }
  const ty=yy+h-30;
  if (card.wild){ ctx.fillStyle='#b3701a'; rrect(x+12,ty,w-24,22,11); ctx.fill();
    ctx.fillStyle='#fff2c8'; ctx.font='bold 12px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('✨ 万能（全タイプ）', x+w/2, ty+15); }
  else if (card.strong){ const t=TAGS[card.strong]; ctx.fillStyle=t.col; rrect(x+12,ty,w-24,22,11); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 12px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('得意: '+t.name,x+w/2,ty+15); }
  else { ctx.fillStyle='#4a5580'; rrect(x+12,ty,w-24,22,11); ctx.fill();
    ctx.fillStyle='#cdd6ff'; ctx.font='bold 12px "Segoe UI"'; ctx.textAlign='center'; ctx.fillText('オールラウンド',x+w/2,ty+15); }
  if (card.sealed){ ctx.globalAlpha=1; ctx.fillStyle='#ff8a9c'; ctx.font='bold 26px "Segoe UI"'; ctx.textAlign='center';
    ctx.fillText('😭封印', x+w/2, yy+h/2); }
  ctx.restore();
}

function drawCutin(){
  const cu=G.cutin, prog=1-cu.t/cu.dur;
  const slide=(1-Math.min(1,prog*3))*220;
  const by=126, bh=178;
  ctx.save();
  ctx.fillStyle= cu.special?'rgba(255,238,180,0.95)':'rgba(255,255,255,0.93)';
  ctx.beginPath(); ctx.moveTo(0,by+22); ctx.lineTo(W,by); ctx.lineTo(W,by+bh); ctx.lineTo(0,by+bh+22); ctx.closePath(); ctx.fill();
  ctx.strokeStyle=cu.special?'#ff9d3c':'#20263a'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(0,by+22); ctx.lineTo(W,by); ctx.moveTo(0,by+bh+22); ctx.lineTo(W,by+bh); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.moveTo(0,by+22); ctx.lineTo(W,by); ctx.lineTo(W,by+bh); ctx.lineTo(0,by+bh+22); ctx.closePath(); ctx.clip();
  ctx.strokeStyle='rgba(30,30,50,0.65)'; ctx.lineWidth=2;
  const fx=310, fy=by+bh/2;
  for(let i=0;i<30;i++){ const a=(i/30)*TAU+0.05;
    ctx.beginPath(); ctx.moveTo(fx+Math.cos(a)*300, fy+Math.sin(a)*300);
    ctx.lineTo(fx+Math.cos(a)*(110+(i%5)*14), fy+Math.sin(a)*(70+(i%4)*12)); ctx.stroke(); }
  ctx.save(); ctx.translate(84-slide*0.4, fy+26); ctx.scale(1.45,1.45); drawHiro(0,-20,1,cu.special?'ronpa':'point',false,true); ctx.restore();
  ctx.restore();
  ctx.save(); ctx.translate(298+slide, fy); ctx.rotate(-0.055);
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.font='bold '+(cu.special?34:28)+'px "Segoe UI"';
  ctx.fillText(cu.text, 3, 11);
  ctx.fillStyle= cu.special?'#c93a00':'#20263a';
  ctx.fillText(cu.text, 0, 8);
  ctx.restore();
  ctx.restore();
}

function wrapText(text,x,y,maxW,lh){ for (const para of String(text).split('\n')){ let line='';
  for (const ch of para){ const test=line+ch; if (ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,y); line=ch; y+=lh; } else line=test; }
  if (line) ctx.fillText(line,x,y); y+=lh; } }

  // 🐢じっくりモード（タップ / Zキーで切替・永続）
  const sr=slowRect(), on=slowOn();
  ctx.fillStyle= on?'rgba(126,200,255,0.18)':'rgba(255,255,255,0.06)'; rrect(sr.x,sr.y,sr.w,sr.h,11); ctx.fill();
  ctx.strokeStyle= on?'#7ec8ff':'rgba(255,255,255,0.28)'; ctx.lineWidth=1.4; rrect(sr.x,sr.y,sr.w,sr.h,11); ctx.stroke();
  ctx.fillStyle= on?'#bfe6ff':'#8b95b8'; ctx.font='bold 12px "Segoe UI"';
  ctx.fillText(on?'🐢 じっくり ON — 15.3秒・やりなおし4かい（Z）'
                 :'🐢 じっくり OFF — 9秒・やりなおし2かい（Zで切替）', W/2, sr.y+16);
  ctx.fillStyle= StoreNoCon.get() ? '#ffe27a' : '#5b6488'; ctx.font='bold 12px "Segoe UI"';
  ctx.fillText(StoreNoCon.get()?'👑 称号『無敗の論客』＋真エンド —— 仕切りなおさず全4話制覇'
                              :'称号『無敗の論客』… 仕切りなおさず全4話制覇で授与＋真エンド',W/2,696);
  const blink=(clock()/500|0)%2===0; ctx.fillStyle=blink?'#ffe27a':'#667'; ctx.font='bold 19px "Segoe UI"';
  ctx.fillText('タップ / クリック / スペースでスタート', W/2, 716);
}

// ---- Input -------------------------------------------------------------------
function onKey(code){
  if (code==='KeyM'){ SFX.toggle(); return; }
  if (state==='continue'){
    if (code==='Space'||code==='Enter') doContinue();
    else if (code==='KeyR'){ state='over'; }
    return; }
  if (state==='title' && code==='KeyZ'){ toggleSlow(); return; }
  if (state==='title'||state==='over'){ if (code==='Space'||code==='Enter') startGame(); return; }
  if (state!=='play') { if (code==='KeyR') startGame(); return; }
  if (G.phase==='shop'){
    if (code==='Digit1'||code==='Numpad1') buyItem(0);
    else if (code==='Digit2'||code==='Numpad2') buyItem(1);
    else if (code==='Digit3'||code==='Numpad3') buyItem(2);
    else if (code==='Digit4'||code==='Numpad4') buyItem(3);
    else if (code==='Space'||code==='Enter'||code==='Escape') openCardPick();
    return;
  }
  if (G.phase==='cardpick'){
    if (code==='Digit1'||code==='Numpad1') pickReward(0);
    else if (code==='Digit2'||code==='Numpad2') pickReward(1);
    else if (code==='Digit3'||code==='Numpad3') pickReward(2);
    return;
  }
  if (code==='KeyR'){ startGame(); return; }
  if (code==='KeyP'){ state=state==='play'?'pause':'play'; return; }
  if (G.phase!=='select') return;
  if (G.menu){
    const entries=menuEntries();
    if (code==='Escape'){ G.menu=null; return; }
    if (code==='Digit1'||code==='Numpad1'){ if(entries[0]) entries[0].fn(); return; }
    if (code==='Digit2'||code==='Numpad2'){ if(entries[1]) entries[1].fn(); return; }
    if (code==='Digit3'||code==='Numpad3'){ if(entries[2]) entries[2].fn(); return; }
    if (code==='Digit4'||code==='Numpad4'){ if(entries[3]) entries[3].fn(); return; }
    if (code==='Digit5'||code==='Numpad5'){ if(entries[4]) entries[4].fn(); return; }
    return;
  }
  if (code==='Space'){ unleashSpecial(); return; }
  if (code==='KeyQ'){ CMDS[0].fn(); return; }
  if (code==='KeyW'){ CMDS[1].fn(); return; }
  if (code==='KeyG'){ chooseGuard(); return; }
  if (code==='Digit1'||code==='Numpad1') playCard(0);
  else if (code==='Digit2'||code==='Numpad2') playCard(1);
  else if (code==='Digit3'||code==='Numpad3') playCard(2);
}

function win(){ state='over'; SFX.stopBGM(); SFX.win(); FX.shake(10); FX.burst(360,240,'#ffe27a',40,1.6,'star'); FX.burst(120,240,'#ffe27a',24,1.3,'star'); FX.ring(240,300,'#ffe27a',20);
  const best=Store.get(); if (best===0||G.turn<best) Store.set(G.turn);
  const r=calcRank(), old=StoreRank.get();
  if (RANKS.indexOf(r)>RANKS.indexOf(old)) StoreRank.set(r);
  markDeep(ENEMIES.length-1);
  if (!G.usedContinue) StoreNoCon.set(1); }
function lose(){ SFX.stopBGM(); SFX.lose(); FX.shake(12); markDeep(G.enemyIdx);
  // 4連戦が一度の事故で全部消えないように、その話の頭からやり直せる（1周2回まで）
  state = G.retries>0 ? 'continue' : 'over'; }
function startGame(){ FX.clear(); newGame(); state='play'; SFX.startBGM(stageMode()); }

state='title';
requestAnimationFrame(loop);
</script>
